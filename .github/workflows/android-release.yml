name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'src/TiktokStreakSaver/TiktokStreakSaver.csproj'

jobs:
  build-android:
    permissions: write-all
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Setup Keystore (Auto-generate if secret missing)
      shell: pwsh
      run: |
        $keystorePath = "src/TiktokStreakSaver/streaksaver.keystore"
        $secretBase64 = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
        $secretPass = "${{ secrets.ANDROID_SIGNING_PASSWORD }}"
        
        # Kalau Secret belum diisi di GitHub, generate otomatis pakai keytool
        if ([string]::IsNullOrEmpty($secretBase64) -or [string]::IsNullOrEmpty($secretPass)) {
          Write-Host "GitHub Secrets not found. Generating a new dummy keystore..."
          $password = "android123"
          $keytool = Join-Path $env:JAVA_HOME "bin\keytool.exe"
          
          & $keytool -genkeypair -v -keystore $keystorePath -alias streaksaver -keyalg RSA -keysize 2048 -validity 10000 -storepass $password -keypass $password -dname "CN=StreakSaver, OU=Dev, O=StreakSaver, L=Unknown, S=Unknown, C=US"
          Write-Host "Dummy keystore generated successfully."
          echo "SIGNING_PASSWORD=$password" >> $env:GITHUB_ENV
        } else {
          Write-Host "Using provided GitHub Secrets..."
          $keystoreBytes = [Convert]::FromBase64String($secretBase64)
          [IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
          echo "SIGNING_PASSWORD=$secretPass" >> $env:GITHUB_ENV
          Write-Host "Keystore decoded successfully."
        }

    - name: Install MAUI workloads
      run: |
        dotnet workload install maui-android
        # maui-ios dihapus karena tidak bisa jalan di windows-latest dan tidak butuh untuk build Android

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Get version from tag
      id: get_version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
        } else {
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh

    - name: Build Android Release
      run: |
        $ver = "${{ steps.get_version.outputs.VERSION }}"
        $parts = $ver -split '\.'
        $major = if($parts.Length -gt 0) { [int]$parts[0] } else { 1 }
        $minor = if($parts.Length -gt 1) { [int]$parts[1] } else { 0 }
        $patch = if($parts.Length -gt 2) { [int]$parts[2] } else { 0 }
        
        $vc = $major * 10000 + $minor * 100 + $patch
        Write-Host "Building with ApplicationVersion=$vc ApplicationDisplayVersion=$ver"
        dotnet publish ${{ env.PROJECT_PATH }} -f net9.0-android -c Release -o ./artifacts -p:ApplicationVersion=$vc -p:ApplicationDisplayVersion=$ver
      shell: pwsh
      env:
        ANDROID_SIGNING_PASSWORD: ${{ env.SIGNING_PASSWORD }}

    - name: Rename APK
      run: |
        $newName = "StreakSaver-v${{ steps.get_version.outputs.VERSION }}.apk"
        $stableName = "StreakSaver.apk"
        $apk = Get-ChildItem -Path ./artifacts -Filter "*-Signed.apk" | Select-Object -First 1
        if (-not $apk) {
          $apk = Get-ChildItem -Path ./artifacts -Filter "*.apk" | Select-Object -First 1
        }
        if ($apk) {
          Rename-Item -Path $apk.FullName -NewName $newName
          Copy-Item -Path "./artifacts/$newName" -Destination "./artifacts/$stableName" -Force
          echo "APK_NAME=$newName" >> $env:GITHUB_OUTPUT
          echo "APK_PATH=./artifacts/$newName" >> $env:GITHUB_OUTPUT
          echo "APK_STABLE_NAME=$stableName" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Path ./artifacts -Filter "*.apk" |
            Where-Object { $_.Name -ne $newName -and $_.Name -ne $stableName } |
            Remove-Item -Force
          Write-Host "Published APK: $newName (+ stable copy: $stableName)"
        }
      shell: pwsh
      id: rename_apk

    - name: APK Identity Report
      run: |
        $ErrorActionPreference = 'SilentlyContinue'
        $apk = Get-ChildItem -Path ./artifacts -Filter "*.apk" | Select-Object -First 1
        if (-not $apk) { Write-Host "No APK found in ./artifacts"; exit 0 }
        $apkPath = $apk.FullName

        $sdkRoot = "$env:ANDROID_SDK_ROOT"
        $aapt = Get-ChildItem "$sdkRoot\build-tools" -Recurse -Filter "aapt.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName

        Write-Host "========================================"
        Write-Host "  APK IDENTITY REPORT"
        Write-Host "========================================"

        if ($aapt) {
          $badging = & $aapt dump badging $apkPath 2>&1
          $packageLine = ($badging | Where-Object { $_ -match "^package:" }) | Select-Object -First 1
          if ($packageLine) {
            $pkgName = if ($packageLine -match "name='([^']+)'")  { $Matches[1] } else { "?" }
            $verCode = if ($packageLine -match "versionCode='([^']+)'") { $Matches[1] } else { "?" }
            $verName = if ($packageLine -match "versionName='([^']+)'") { $Matches[1] } else { "?" }
            Write-Host "PackageName  = $pkgName"
            Write-Host "VersionName  = $verName"
            Write-Host "VersionCode  = $verCode"
          }
        } else {
          Write-Host "aapt not found — skipping badging dump"
        }

        $apkSigner = Get-ChildItem "$sdkRoot\build-tools" -Recurse -Filter "apksigner.bat" |
                     Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        if ($apkSigner) {
          $sigInfo = & $apkSigner verify --print-certs $apkPath 2>&1
          $sha256Line = ($sigInfo | Where-Object { $_ -match "SHA-256" }) | Select-Object -First 1
          Write-Host "Signature SHA-256 = $sha256Line"
        } else {
          Write-Host "apksigner not found — skipping cert fingerprint"
        }

        Write-Host "----------------------------------------"
        Write-Host "Project ApplicationId  = com.jon2g.tiktokstreaksaver"
        Write-Host "Tag Version = ${{ steps.get_version.outputs.VERSION }}"
        Write-Host "========================================"
      shell: pwsh
      id: apk_identity
      continue-on-error: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ./artifacts/*.apk
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
        name: Streak Saver v${{ steps.get_version.outputs.VERSION }}
        generate_release_notes: true
        files: ./artifacts/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}